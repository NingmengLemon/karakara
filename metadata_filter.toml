# metadata_filter.toml
#
# 元数据行过滤配置文件。
# 所有默认值在此文件中显式定义，无隐式回退。
#
# [enabled]   — 各检测策略的开关
# [keywords]  — 关键字匹配（"作词: xxx" 等）
# [id3_tags]  — ID3 风格标签（"[ti:...]" 等）
# [parenthetical] — 括号段落标记（"(间奏)" 等）
# [custom]    — 自定义正则表达式
#
# 下面那些数字来自对真实曲库（6622 个 .lrc / 556,730 个非空行）的实际统计，
# 不是估的；每条都注明了「命中规模」与「假阳性风险」。要调整时请把同一套
# 度量重跑一遍再说，曲库扫描脚本见 README「已知问题」一节附近。

[enabled]
keywords = true
# 打开，但要知道它在本管线里**基本是空转**：`lemony-lrc-parser` 会先把
# `[ti:] [ar:] [by:] [offset:]` 这类标签收进 `lyrics.metadata`，它们**不会**以
# 「行」的形态到达这里（实测：裸文本里有 495 行这种标签，到达过滤器的 0 行）。
# 保留开启是为了让 MetadataFilter 独立使用时（以及将来换解析器时）仍然正确；
# 别指望它带来召回提升。（早期一次统计曾把这 495 行算成收益，那是按裸文本数的。）
id3_tags = true
# 打开：实测 37 行 / 15 文件，逐条核对全部是真段落标记（"(间奏)"、"(Bridge)"…）。
# 注意这一条**必须是白名单 + 整行匹配**：把「整行被括号包裹」当形状规则用会命中
# 10,163 行 / 1,887 文件，其中 49.7% 在文件中段，绝大多数是歌词本身
# （`（与你同在）`、`(By your side)`、`「よっしゃー行くぞ」`）。
parenthetical = true
# 保持关闭：纯数字行里混着演唱内容——`1`/`2`/`3`（「コンコンきつね」的报数演唱）、
# `1234`、`11111111111111111111111111111111`（「魔理沙は大変なものを盗んでいきました」
# 的连打）。77 行里至少 5 个文件的纯数字行是歌词。
pure_numbers = false

# ---- 关键字匹配（「关键字: 值」格式，整行以关键字开头 + 冒号） ----
#
# 匹配形态是 `^\s*(?:关键字)\s*[：:].*` + re.IGNORECASE，因此英文关键字大小写无关，
# 而「关键字出现在行中间」不会被误判。
[keywords]
items = [
    # ---------- 原本就有的 ----------
    "作词", "作曲", "编曲", "演唱", "专辑", "歌手",
    "制作人", "和声", "混音", "录音", "监制", "策划",
    "封面设计", "文案", "出品",
    "OP", "SP", "翻译", "PV", "母带", "调教", "调校",
    "曲绘", "原曲", "編曲", "作詞", "唄", "呗",

    # ---------- 中文简称与复合写法（风险：低） ----------
    # 真实曲库里的漏网主力就是这类缩写：「曲：シャノン」「词：みきとP」「歌：GUMI」。
    # 单字条目（词/詞/曲/歌/唱/译/譯/绘/繪/调/混）在形态上仍要求「整行以它开头并紧接
    # 冒号」，实测 0 误伤；但单字本身信息量低，若遇到别的语料误伤，优先砍这几个。
    "词", "詞", "曲", "歌", "唱", "译", "譯", "绘", "繪", "调", "混",
    "词曲", "詞曲", "作编曲", "作編曲", "作词作曲", "编曲混音", "词、曲",
    "词曲编调绘", "词曲编调绘视", "词曲编调绘视频", "词曲编调混",

    # ---------- 中文职位（风险：低） ----------
    "原唱", "翻唱", "演唱者", "歌唱", "人声", "原作",
    "和声编写", "混音师", "混音工程师", "母带工程师", "录音师",
    "美术", "人设", "画师", "插画", "封面", "视频", "映像", "MV制作", "制作",
    "所属专辑", "歌名日文", "歌词", "歌词制作",
    "成曲时间", "成词时间", "投稿时间", "発売日", "协力", "企画",
    "特别感谢", "翻譯來源", "翻译来源", "翻译取自", "注",
    # 本库 0 命中（样本不足），加入无副作用也无收益，按需保留：
    "特別感謝", "鸣谢", "鳴謝", "翻译鸣谢",

    # ---------- 乐器（风险：低） ----------
    "吉他", "贝斯", "鼓", "弦乐", "弦乐编写", "大提琴", "小提琴", "二胡",
    "琵琶", "打击乐", "键盘类乐器", "音乐", "音楽",

    # ---------- 日文（本库几乎 0 命中，样本不足；日文 LRC 里这些是常见写法） ----------
    "イラスト", "動画", "絵", "調声", "調教", "ミックス", "ミキシング", "マスタリング",
    "ボーカル", "コーラス", "ギター", "ベース", "ドラム", "ピアノ", "ストリングス",

    # ---------- 英文（受 IGNORECASE 影响，大小写无关；风险：低） ----------
    "Vocal", "Vocals", "Vocalist", "Singer", "Singers", "Vo", "Chorus",
    "Guitar", "Bass", "Drums", "Piano", "Strings", "Mix", "Mixing", "Mastering",
    "Arrange", "Arrangement", "Album", "Music", "Lyrics", "Lyric", "Original",
    "Director", "Engineer", "Illustration", "Rap", "remix", "Prod",

    # ---------- 刻意**没有**加进来的（都有实测假阳性证据） ----------
    # `合` `洛` `绫` `雏` `美纪` `胡桃`：这是对唱/角色分句标记，冒号**后面就是歌词正文**
    #   （`合：赔盏茶才算周到`、`雏：才会这样慌不择路急不择途地迷失吗`），
    #   分别命中 48 / 28 / 15 / 27 / 15 / 14 行，mid 占比 0.46–0.63。
    # `8` `10`：`8:07に君を待ってる`、`8:00 二号车二节 被占的特等座` 这类「时间+歌词」。
    # `_`：`_(:з」∠)_` 颜文字。
    # `谢谢` / `感谢`：`谢谢 想说谢谢你`、`谢谢，我吃饱了` 都是歌词；
    #   只有 `特别感谢` / `特別感謝` / `鸣谢` 这类强限定词才算署名（已加）。
    # `Thanks`：`Thanks for the meal`、`Thanks a lot 君のsongが好きそう☺️` 是歌词。
]

# ---- ID3 风格标签（[tag: value] 格式） ----
# `ly` / `mu` / `total` 是 LRC 里常见但此前没列的标签
# （裸文本实例：`[ly: 苍十三 / 阿良良木健]`、`[mu: …]`、`[total: 274005]`）。
# 同样地，这些标签在管线里由解析器先行消费，见上面 [enabled] 的说明。
[id3_tags]
tags = ["ti", "ar", "al", "by", "re", "ve", "offset", "length", "tool", "ly", "mu", "total"]

# ---- 括号段落标记（整行匹配；全角/半角括号都认） ----
[parenthetical]
markers = [
    # 中文
    "前奏", "间奏", "尾奏", "副歌", "主歌", "过渡", "桥段",
    "前奏曲", "间奏曲", "结尾", "尾聲", "尾声", "結束",
    # 英文
    "Prelude", "Interlude", "Outro", "Intro", "Chorus",
    "Verse", "Bridge", "Instrumental", "Ending", "Solo",
    "Opening", "Break", "Refrain",
    # 日文
    "イントロ", "アウトロ", "間奏", "サビ", "落ちサビ", "ラスサビ", "大サビ",
    "エンディング", "インスト",
]

# ---- 自定义正则（每项为完整的正则表达式字符串） ----
#
# 两个坑：
#  1. 不要写裸 `(?i)` —— 所有分支会被 `|` 拼成一条正则，裸 `(?i)` 不在表达式开头，
#     `re.compile` 会抛 `re.error: global flags not at the start of the expression`。
#     要用作用域写法 `(?i:...)`（外层的 re.IGNORECASE 对全部分支生效）。
#  2. TOML 里 `\s` 要写单引号字面量字符串（或 `\\s`），双引号会报 Unescaped '\'。
#
# 每条后面的「命中」都是本库 6622 个 lrc 的实测值。
[custom]
patterns = [
    # ① 关键字前有装饰/括号，或关键字与冒号之间夹着英文注释。
    #    覆盖 `（翻译鸣谢:弓野笃祯）`、`【翻译来源：…】`、`编曲 Arranger：宫奇Gon`、
    #    `出品 Produced by：HOYO-MiX`、`母带 by KyuRu☆`。
    #    实测命中 12,003 行 / 4,980 文件（其中 11,957 行本就是前面那些关键字抓到的），
    #    未发现歌词误伤。
    '^\s*[【\[（(♪★※*]{0,2}\s*(?:作词|作詞|作曲|编曲|編曲|混音|母带|母帶|制作人|製作人|演唱|演唱者|录音|錄音|监制|監製|策划|企劃|出品|翻译|翻譯|曲绘|曲繪|插画|插畫|视频|視頻|动画|動畫|和声|和聲|鼓|贝斯|吉他|弦乐|弦樂)[^:：\n]{0,16}[:：]',

    # ② 英文 "X by Y" 署名（`Vocals by Hannah Crowley`、`Strings by Leah Zeger`）。
    #    实测 28 行 / 14 文件，全部是真署名。
    #    残留风险：英文歌词里形如 `Sound by the sea` 的句子也会被它命中——本库 0 例，
    #    但它毕竟是形状规则，真遇到就删掉这一条。
    '(?i:^\s*(?:music|lyrics?|melody|arrang\w*|compos\w*|mix\w*|master\w*|produc\w*|vocal\w*|illust\w*|animat\w*|direct\w*|guitar|bass|drums?|piano|strings?|programm\w*|tuning|edit\w*|design\w*|photo\w*|sound)\b[\s\S]{0,40}\bby\b\s*\S)',

    # ③ 分隔线 / 纯点号 / 纯音符行。实测 313 行 / 104 文件。
    #    必须是「整行只由这些符号构成」——放宽成「含符号就删」会砍掉 `**你是什么垃圾？**`
    #    这种歌词。
    '^\s*(?:[-=~_*—–―ー〜※·・]{3,}|[.。…]{2,}|[♪♫♩♬]+)\s*$',

    # ④ 纯 Music / Instrumental / Solo 行（`music`、`INSTRUMENTAL`、`Music♪`）。
    #    实测 150 行 / 80 文件，其中 51% 在文件中段。
    '(?i:^\s*(?:music|interlude|instrumental|solo)[\s.。…♪♫-]*$)',

    # ⑤ 结束标记（`End`、`(END)`、`終わり`、`完`）。实测 202 行 / 173 文件，
    #    92.6% 在文件末 3 行。
    '(?i:^\s*[-–—\[（(]{0,3}\s*(?:end|fin|the\s+end|終わり|おわり|終|完)\s*[-–—\]）).。!！]{0,3}\s*$)',

    # ⑥ 段落标记裸行（没有括号）：`Intro`、`Solo`、`BREAK`、`サビ`、`間奏`。
    #    实测 20 行 / 9 文件，样本偏少但未误伤歌词。
    '(?i:^\s*(?:intro|outro|interlude|verse|chorus|bridge|refrain|prelude|instrumental|solo|opening|ending|break|hook|[A-Ca-c]\s*メロ|サビ|ラスサビ|大サビ|落ちサビ|イントロ|アウトロ|間奏|前奏|後奏|エンディング)\s*[0-9]?\s*$)',

    # ⑦ 空值占位行（`undefined` 之类，是制谱工具的产物）。实测 21 行 / 18 文件，
    #    90.5% 在文件末 3 行，零误伤。
    '(?i:^\s*(?:undefined|null|nan|none|nil|unknown)\s*$)',
]
