[project]
name = "karakara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "av>=15.1.0",
    "eval-type-backport>=0.3.0",
    # "faster-whisper>=1.2.1",
    # "funasr>=1.2.7",
    "lemony-lrc-parser>=0.4.0b2,<0.5.0",
    "numpy<2",
    # "openai-whisper>=20250625",
    # "phonemizer>=3.3.0",
    "pydantic>=2.12.4",
    "pypinyin>=0.55.0",
    "regex>=2025.11.3",
    "requests>=2.32.5",
    "soundfile>=0.13.1",
    "typing-extensions>=4.15.0",
    "zhconv>=1.4.3",
]
requires-python = "==3.12.*"

[tool.mypy]
follow_imports = "normal"
ignore_missing_imports = true
show_column_numbers = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
disallow_untyped_calls = true
strict_equality = true


[tool.ty.src]
# 这三个脚本**故意**运行在自己的虚拟环境里（PEP 723 内联依赖，见各脚本头部），
# 它们 import 的 torch / demucs / librosa / fastapi / qwen_asr / audio_separator
# 本来就不属于主环境。拿主环境的依赖集合去检查它们只会得到一堆
# unresolved-import，把真正的类型错误淹掉。
exclude = [
    "scripts/separator_worker.py",
    "scripts/separator_worker_audio_separator.py",
    "scripts/qwen3aligner_server.py",
]

[tool.ty.rules]
# 同时挂 mypy 与 ty 时，"这条 type: ignore 多余"不是可执行的信息：一个检查器需要
# 的抑制注释，另一个常认为多余。抑制注释的治理交给 mypy。
unused-type-ignore-comment = "ignore"


[tool.uv.sources]
lemony_lrc_parser = { index = "pypi" }

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

explicit = true
[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "modelscope>=1.35.3",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.8",
    "ty>=0.0.80",
    "types-requests>=2.32.4.20250913",
]
qwenaligner = ["fastapi>=0.135.3", "pydantic>=2.12.4", "qwen-asr>=0.0.6"]

[tool.uv]
package = true
# 音轨分离（Demucs 等）与对齐模型都跑在独立进程/独立环境里：
# scripts/separator_worker.py 与 scripts/qwen3aligner_server.py 通过 PEP 723
# 内联依赖由 `uv run --script` 准备环境，因此主环境不需要 torch。
environments = ["sys_platform == 'win32'"]
