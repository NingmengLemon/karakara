[project]
name = "karakara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "av>=15.1.0",
    "eval-type-backport>=0.3.0",
    # "faster-whisper>=1.2.1",
    # "funasr>=1.2.7",
    "lemony-lrc-parser>=0.4.0b2,<0.5.0",
    "numpy<2",
    # "openai-whisper>=20250625",
    # "phonemizer>=3.3.0",
    "pydantic>=2.12.4",
    "pypinyin>=0.55.0",
    "regex>=2025.11.3",
    "requests>=2.32.5",
    "soundfile>=0.13.1",
    "typing-extensions>=4.15.0",
    "zhconv>=1.4.3",
]
requires-python = "==3.12.*"

[tool.ty.src]
# 这四个脚本**故意**运行在自己的虚拟环境里（PEP 723 内联依赖，见各脚本头部），
# 它们 import 的 torch / demucs / librosa / fastapi / qwen_asr / audio_separator
# 本来就不属于主环境。拿主环境的依赖集合去检查它们只会得到一堆
# unresolved-import，把真正的类型错误淹掉。
exclude = [
    "scripts/separator_worker.py",
    "scripts/separator_worker_audio_separator.py",
    "scripts/qwen3aligner_server.py",
    "scripts/hubertfa_aligner_server.py",
    "tmp",
    "models",
    "third_party",
]


[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["tmp", ".venv", "models", "third_party"]

[tool.ruff.lint]
# E4/E7/E9 + F 是 ruff 的默认集；其余是真正能抓到东西的现代化规则。
# 刻意**不**选完整的 "E"：那会带上 E501，而换行宽度交给 ruff format 管
# （ruff 官方对同时使用 formatter 的项目就是这么建议的）。
select = [
    "E4",   # pycodestyle: import
    "E7",   # pycodestyle: statement
    "E9",   # pycodestyle: runtime / 语法
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "PYI",  # flake8-pyi
    "RUF",  # ruff 自带规则
]
# RUF001/002/003 是「字符串/注释里出现了易混淆的 Unicode 字符」。本项目是中文项目，
# 全角标点（，：；（））是刻意的书写风格，不是笔误。
#
# ANN401（注解里出现 `Any`）在本项目里几乎全是与无类型第三方打交道的边界
# （PyAV 的帧对象、tkinter 的 event、sounddevice 的流），收窄它们只会得到一堆
# cast。真正有价值的是 ANN 的其余部分：**函数必须有注解**（这条以前由 mypy 的
# disallow_untyped_defs 保证，mypy 移除后交给 ruff）。
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]
# FastAPI 的依赖注入就是靠「在默认值里调用 File()/Form()/Depends()」，
# B008 在这类文件上是误报。
# scripts/ 下的 worker 脚本同样如此（它们要 decorate 路由或读 sys.argv）。
[tool.ruff.lint.per-file-ignores]
"scripts/qwen3aligner_server.py" = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
]


[tool.uv.sources]
lemony_lrc_parser = { index = "pypi" }

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

explicit = true
[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch_cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "modelscope>=1.35.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.8",
    # 放在 dev 里是为了让 ty 能解析 `karakara.gui.player` 的 import；
    # 运行时它属于下面的 gui 组（GUI 是可选入口，主程序不需要它）。
    "sounddevice>=0.5.1",
    "ty>=0.0.80",
    "types-requests>=2.32.4.20250913",
]
qwenaligner = ["fastapi>=0.135.3", "pydantic>=2.12.4", "qwen-asr>=0.0.6"]
# 图形工具（`scripts/offset_gui.py`）用：tkinter 是标准库，只有播放需要额外依赖。
# 缺这个包时 GUI 仍能看波形、调偏移、写回，只是不能出声。
gui = ["sounddevice>=0.5.1"]

[tool.uv]
package = true
# 音轨分离（Demucs 等）与对齐模型都跑在独立进程/独立环境里：
# scripts/separator_worker.py 与 scripts/qwen3aligner_server.py 通过 PEP 723
# 内联依赖由 `uv run --script` 准备环境，因此主环境不需要 torch。
environments = ["sys_platform == 'win32'"]
